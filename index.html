<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto: Missão Ninja</title>
    <style>
        body {
            background-color: #1a252f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 4px solid #ecf0f1;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.8);
            margin-top: 10px;
        }
        #message {
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0;
            color: #e74c3c;
            min-height: 32px;
        }
        #restartBtn {
            display: none;
            margin: 10px auto;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #restartBtn:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <h1>Naruto: Missão Ninja</h1>
    <p><b>A / D</b> ou <b>Setas</b> para andar | <b>W / Espaço</b> para pular | <b>F</b> Shuriken | <b>R</b> Rasengan</p>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="message"></div>
    <button id="restartBtn" onclick="reiniciarJogo()">Jogar Novamente</button>

    <script src="script.js"></script>
</body>
</html>
